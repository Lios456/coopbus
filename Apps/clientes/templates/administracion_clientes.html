{% extends 'base.html' %}

{% block body %}
    <div class="container-lg m-5 p-5">
        <div class="container text-center">
            <h1 class="h1">Administración de clientes</h1>
        </div>
        <div class="d-flex justify-items-center">
            <div class="container w-50">
                <form method="post">
                    {% csrf_token %}
                    {{form.as_p}}
                    <div class="d-flex justify-content-center">
                        <button class="rounded-0 btn btn-outline-success w-50">
                            GUARDAR
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
